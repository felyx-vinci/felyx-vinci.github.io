<style>

  #comecar { padding: 16px 34px; border: 0; border-radius: 999px; background: var(--vinci); color: #111;
    font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: 0 0 24px rgba(214, 255, 26, .35); }

  #state { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); min-height: 1.2em; }

  #casa { min-height: 1.4em; font-size: 14px; color: var(--vinci); opacity: .85; }

  .topo button { background: none; border: 0; color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .topo button[hidden] { display: none; }
  #login { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: var(--bg); padding: 16px; }
  #login[data-on="1"] { display: flex; }
  #login form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  #login h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: .04em; color: var(--vinci); text-align: center; }
  #login input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #2a2f15; background: var(--panel);
    color: var(--text); font-size: 16px; }
  #login button { padding: 14px; border-radius: 10px; border: 0; background: var(--vinci); color: #111; font-size: 16px; font-weight: 600; cursor: pointer; }
  #login .link { background: none; color: var(--muted); font-weight: 400; padding: 6px; }
  #loginErro { min-height: 1.3em; font-size: 14px; color: #ff8a7a; text-align: center; }

  'Pronúncia de "Vinci" (a empresa e Leonardo da Vinci): sempre em italiano, "Víntchi" (como "vinti" dito no português do Brasil). Nunca diga "Vince", "Vínsi" nem "Vinssi".' + " " +
  "Você aparece em vídeo, com rosto, como numa chamada: fale como uma pessoa olhando para quem conversa. " +

// --- sessão (mesmo login do Felyx Lite) ---
let SESSAO = "";
try { SESSAO = localStorage.getItem("felyx_lite_sessao") || ""; } catch (e) {}
function salvarSessao(t) {

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random());

// --- microfone: PCM 16-bit 16 kHz em blocos de ~100 ms ---
const MIC_WORKLET = `class MicProcessor extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / 16000; this.buffer = []; this.pos = 0; }
  process(inputs) {
    const input = inputs[0][0];
    if (!input) return true;
    for (; this.pos < input.length; this.pos += this.ratio) {
      const s = Math.max(-1, Math.min(1, input[Math.floor(this.pos)]));
      this.buffer.push(s < 0 ? s * 0x8000 : s * 0x7fff);
    }
    this.pos -= input.length;
    if (this.buffer.length >= 1600) { this.port.postMessage(Int16Array.from(this.buffer).buffer); this.buffer = []; }
    return true;
  }
}
registerProcessor("mic-processor", MicProcessor);`;

// --- LiveAvatar: comandos pelo WebSocket da sessão ---
function avatarSend(type, extra) {
  if (avatarWs?.readyState === 1 && avatar?.pronto) avatarWs.send(JSON.stringify({ type, event_id: uid(), ...extra }));
}
let falaAberta = false, ouvindo = false, avatarFalando = false;
// junta os pedaços do Gemini (~40 ms cada) em blocos de ~0,25 s para não inundar o WebSocket
let pcmFila = [], pcmBytes = 0, filaTimer = null;
const BLOCO = 24000 * 2 * 0.25;
function enviarBloco() {
  clearTimeout(filaTimer); filaTimer = null;
  if (!pcmBytes) return;
  const tudo = new Uint8Array(pcmBytes); let o = 0;
  for (const p of pcmFila) { tudo.set(p, o); o += p.length; }
  pcmFila = []; pcmBytes = 0;
  let bin = ""; for (let i = 0; i < tudo.length; i += 0x8000) bin += String.fromCharCode(...tudo.subarray(i, i + 0x8000));
  if (ouvindo) { avatarSend("agent.stop_listening"); ouvindo = false; }
  avatarSend("agent.speak", { audio: btoa(bin) });
  falaAberta = true;
}
function falar(b64) { // cada pedaço do Gemini vai na hora: o primeiro som chega ao avatar sem esperar bloco nenhum
  ultimoUso = Date.now();
  if (segurando) { segurados.push(b64); return; }
  if (ouvindo) { avatarSend("agent.stop_listening"); ouvindo = false; }
  avatarSend("agent.speak", { audio: b64 });
  falaAberta = true;
}
function fimDaFala() {
  if (segurando) { fimSegurado = true; return; }
  enviarBloco();
  if (falaAberta) { avatarSend("agent.speak_end"); falaAberta = false; }
}
function interromper() {
  pcmFila = []; pcmBytes = 0; clearTimeout(filaTimer); filaTimer = null;
  segurados = []; segurando = false; fimSegurado = false;
  if (falaAberta || avatarFalando) avatarSend("agent.interrupt");
  falaAberta = false;
}
function escutando() { // reação de quem está ouvindo, sem mexer a boca
  ultimoUso = Date.now();
  if (!ouvindo && !avatarFalando && !falaAberta) { avatarSend("agent.start_listening"); ouvindo = true; }
}

// --- teclado: enquanto ele pesquisa, cliques de teclado; a resposta sai assim que chega (o avatar já tem o atraso do vídeo) ---
const TECLADO_MIN = 0;
let digitando = false, inicioDigitacao = 0, segurando = false, segurados = [], fimSegurado = false, timerTeclado = null;
function clique() {
  if (!audioCtx) return;
  const dur = 0.03, buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length / 6));
  const src = audioCtx.createBufferSource(), filtro = audioCtx.createBiquadFilter(), vol = audioCtx.createGain();
  filtro.type = "bandpass"; filtro.frequency.value = 2500 + Math.random() * 2500; filtro.Q.value = 1.2;
  vol.gain.value = 0.25 + Math.random() * 0.15;
  src.buffer = buf; src.connect(filtro).connect(vol).connect(audioCtx.destination); src.start();
}
function iniciarTeclado() {
  if (digitando) return;
  digitando = true; segurando = true; inicioDigitacao = 0;
  fimDaFalaAtual();
  const desde = performance.now();
  const proximo = () => {
    if (!digitando) { timerTeclado = null; return; }
    if (performance.now() - desde > 30000) return pararTeclado(); // a ferramenta travou: não digita para sempre
    if (segurados.length) return soltarResposta(); // a resposta chegou: fala já, sem esperar
    if (!avatarFalando) clique(); // só digita depois que a frase de espera terminou no avatar
    timerTeclado = setTimeout(proximo, 70 + Math.random() * (Math.random() < 0.15 ? 380 : 120));
  };
  proximo();
}
function fimDaFalaAtual() { enviarBloco(); if (falaAberta) { avatarSend("agent.speak_end"); falaAberta = false; } }
function soltarResposta() {
  digitando = false; segurando = false; timerTeclado = null;
  const fila = segurados; segurados = [];
  fila.forEach(falar);
  if (fimSegurado) { fimSegurado = false; fimDaFala(); }
}
function pararTeclado() { digitando = false; if (segurando) soltarResposta(); }

// --- ferramentas (iguais às do Felyx Lite) ---
function textoComando(nome, acao) {
  const cena = casa.cenas.includes(nome);
  if (!cena) return `${acao === "desligar" ? "desligar" : "ligar"} ${nome}`;
  return `${acao === "desligar" && casa.desativaveis.includes(nome) ? "desativar" : "ativar"} cena ${nome}`;
}
async function controlarCasa({ dispositivo, acao }) {
  casaEl.textContent = `${acao} → ${dispositivo}…`;
  const j = await app({ acao: "comando", token: SESSAO, texto: textoComando(dispositivo, acao) });
  casaEl.textContent = j.ok ? `✓ ${j.text || dispositivo}` : `✗ ${j.text || j.mensagem || "a casa não confirmou"}`;
  return { ok: !!j.ok, resposta: j.text || j.mensagem || "" };
}
async function apoio(acao, dados) {
  const r = await fetch(APOIO_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ sessao: SESSAO, acao }, dados)) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 || j.relogar) { salvarSessao(""); stop(); mostrarLogin("A sessão expirou. Entre de novo."); }
  return j.dados || { erro: "indisponível agora" };
}
async function buscarInformacao({ tema }) {
  casaEl.textContent = "pesquisando…";
  try {
    if (tema === "bolsas") return await apoio("mercado", { pedido: "como estão as bolsas" });
    const j = await (await fetch(tema === "noticias" ? NOTICIAS_URL : MERCADO_URL, { cache: "no-store" })).json();
    if (tema !== "noticias") return j;
    const resumo = {};
    for (const [k, v] of Object.entries(j)) if (Array.isArray(v)) resumo[k] = v.slice(0, 5).map((n) => ({ titulo: n.title, fonte: n.source, data: n.date, url: n.link }));
    return resumo;
  } finally { casaEl.textContent = ""; }
}
const TEMPO = { 0: "céu limpo", 1: "quase limpo", 2: "parcialmente nublado", 3: "nublado", 45: "neblina", 48: "neblina", 51: "garoa", 53: "garoa", 55: "garoa forte",
  61: "chuva fraca", 63: "chuva", 65: "chuva forte", 80: "pancadas de chuva", 81: "pancadas de chuva", 82: "pancadas fortes", 95: "trovoadas", 96: "trovoadas", 99: "trovoadas" };
async function clima() {
  const u = "https://api.open-meteo.com/v1/forecast?latitude=-22.97&longitude=-43.19&current=temperature_2m,apparent_temperature,weather_code" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America/Sao_Paulo&forecast_days=1";
  const j = await (await fetch(u)).json();
  return { agora: j.current.temperature_2m, sensacao: j.current.apparent_temperature, tempo: TEMPO[j.current.weather_code] || "",
    maxima: j.daily.temperature_2m_max[0], minima: j.daily.temperature_2m_min[0], chanceChuva: j.daily.precipitation_probability_max[0] };
}
async function noticias({ busca, url }) {
  casaEl.textContent = "pesquisando…";
  try { return await apoio("noticia", { busca: busca || "", url: url || "" }); } finally { casaEl.textContent = ""; }
}
async function memoria(a) { return apoio("memoria", a); }
// cumprimento completo no máximo a cada 4 horas (cumprimento.js); quando liberado, já traz tudo de uma vez
async function dadosDoCumprimento() {
  if (felyxCumprimento.recente()) return { completo: false };
  felyxCumprimento.marcar();
  casaEl.textContent = "pesquisando…";
  const ok = (p) => p.catch(() => ({ erro: "indisponível agora" }));
  const [c, m, b, n] = await Promise.all([ok(clima()), ok(buscarInformacao({ tema: "mercado" })), ok(apoio("mercado", { pedido: "bom dia" })), ok(buscarInformacao({ tema: "noticias" }))]);
  casaEl.textContent = "";
  return { completo: true, clima: c, mercado: m, bolsas: b, manchetes: n };
}
const ROTINAS_KEY = "felyx_lite_rotinas";
function lerRotinas() { try { return JSON.parse(localStorage.getItem(ROTINAS_KEY) || "{}"); } catch (e) { return {}; } }
function gravarRotinas(r) { try { localStorage.setItem(ROTINAS_KEY, JSON.stringify(r)); } catch (e) {} }
const espera = (ms) => new Promise((ok) => setTimeout(ok, ms));
function acharRotina(nome) { return Object.keys(lerRotinas()).find((n) => n.toLowerCase() === String(nome || "").toLowerCase()); }
async function salvarRotina({ nome, passos }) {
  const r = lerRotinas(); r[nome] = { passos: passos || [] }; gravarRotinas(r);
  casaEl.textContent = `✓ rotina ${nome} salva`;
  return { ok: true };
}
async function apagarRotina({ nome }) {
  const r = lerRotinas(), n = acharRotina(nome); if (n) delete r[n]; gravarRotinas(r);
  casaEl.textContent = n ? `✓ rotina ${n} apagada` : "";
  return { ok: !!n };
}
async function executarRotina({ nome }) {
  const n = acharRotina(nome);
  if (!n) return { ok: false, erro: "Rotina não encontrada: " + nome };
  casaEl.textContent = `rotina ${n}…`;
  const passos = [];
  for (const p of lerRotinas()[n].passos) {
    const j = await app({ acao: "comando", token: SESSAO, texto: textoComando(p.dispositivo, p.acao) });
    passos.push({ ...p, ok: !!j.ok, resposta: j.text || j.mensagem || "" });
    await espera(1500);
  }
  const ok = passos.every((p) => p.ok);
  casaEl.textContent = ok ? `✓ rotina ${n}` : `✗ rotina ${n}: algum passo falhou`;
  return { ok, rotina: n, passos };
}
const FERRAMENTAS = { controlar_casa: controlarCasa, buscar_informacao: buscarInformacao, dados_do_cumprimento: dadosDoCumprimento, clima, noticias, memoria,
  salvar_rotina: salvarRotina, apagar_rotina: apagarRotina, executar_rotina: executarRotina };
const DEMORADAS = new Set(["buscar_informacao", "dados_do_cumprimento", "noticias", "executar_rotina"]);
async function executar(call) {
  if (DEMORADAS.has(call.name)) iniciarTeclado();
  let response;
  try { response = await FERRAMENTAS[call.name](call.args || {}); }
  catch (e) { response = { erro: e.message }; casaEl.textContent = ""; }
  return { id: call.id, name: call.name, response };
}

// --- avatar: abre a sessão LITE (n8n), entra na sala LiveKit e liga o WebSocket de comandos ---
async function abrirAvatar() {
  const r = await fetch(PRO_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessao: SESSAO }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 || j.relogar) { salvarSessao(""); throw new Error("Entre de novo para chamar o Felyx."); }
  if (!j.ok || !j.livekit_url || !j.ws_url) throw new Error("O avatar não abriu agora. Tente de novo.");
  avatar = { id: j.session_id, token: j.session_token, pronto: false };
  if (j.nome) try { localStorage.setItem("felyx_nome", j.nome); } catch (e) {}

  const LK = window.LivekitClient;
  room = new LK.Room({ adaptiveStream: true });
  room.on(LK.RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === "video") { track.attach(video); video.onplaying = () => video.classList.add("on"); }
    if (track.kind === "audio") { track.attach(audioEl); audioEl.play().catch(() => {}); }
  });
  room.on(LK.RoomEvent.Disconnected, () => { if (avatar) stop("O Felyx saiu da chamada."); });
  await room.connect(j.livekit_url, j.livekit_client_token);

  await new Promise((ok, falha) => {
    avatarWs = new WebSocket(j.ws_url);
    const limite = setTimeout(() => falha(new Error("O avatar demorou para responder.")), 20000);
    avatarWs.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.type === "session.state_updated" && m.state === "connected") { avatar.pronto = true; clearTimeout(limite); ok(); }
      if (m.type === "session.state_updated" && m.state === "disconnected") stop("O Felyx saiu da chamada.");
      if (m.type === "agent.state_updated") avatarFalando = m.new_state === "talking";
      if (m.type === "error") console.warn("LiveAvatar:", m);
    };
    avatarWs.onerror = () => falha(new Error("Sem conexão com o avatar."));
  });
  keepAlive = setInterval(() => avatarSend("session.keep_alive"), 60000);
}
function fecharAvatar() {
  clearInterval(keepAlive);
  const a = avatar; avatar = null;
  try { avatarWs?.close(); } catch (e) {}
  try { room?.disconnect(); } catch (e) {}
  avatarWs = null; room = null;
  video.classList.remove("on");
  if (a?.token) fetch("https://api.liveavatar.com/v1/sessions/stop", { method: "POST", keepalive: true,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + a.token },
    body: JSON.stringify({ session_id: a.id, reason: "USER_CLOSED" }) }).catch(() => {});
}

// --- sessão com o Gemini ---
async function start() {
  if (ws) return;
  if (!SESSAO) return mostrarLogin("");
  $("comecar").hidden = true;
  setState("");
  const iris = felyxIris.desbloquear(document.querySelector(".quadro"));   // o rosto conecta enquanto a íris é lida
  audioCtx = new AudioContext();
  audioEl.play().catch(() => {});
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  const [tr, lista] = await Promise.all([
    fetch(TOKEN_URL + "?s=" + encodeURIComponent(SESSAO), { cache: "no-store" }),
    app({ acao: "casa", token: SESSAO }).catch(() => null),
    abrirAvatar(),
  ]);
  if (tr.status === 401) { salvarSessao(""); throw new Error("Entre de novo para usar a voz."); }
  const tk = await tr.json();
  if (!tk.token) throw new Error("sem token de voz");
  if (lista && lista.ok) casa = { cenas: lista.cenas || [], desativaveis: lista.desativaveis || [], aparelhos: (lista.aparelhos || []).map((a) => a.nome) };
  casaEl.textContent = lista && lista.ponte && lista.ponte.online ? "casa conectada" : "casa offline";

  await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([MIC_WORKLET], { type: "text/javascript" })));
  micNode = new AudioWorkletNode(audioCtx, "mic-processor");
  audioCtx.createMediaStreamSource(micStream).connect(micNode);

  const rotinas = Object.entries(lerRotinas()).map(([n, r]) => `${n}: ` + r.passos.map((p) => `${p.acao} ${p.dispositivo}`).join(", depois ")).join("\n");
  const nomes = "Rotinas salvas:\n" + (rotinas || "nenhuma") + "\n\nAparelhos: " + casa.aparelhos.join(", ") + "\nCenas: " + casa.cenas.join(", ");
  // memórias já gravadas (felix_memoria), para o Gemini saber sem precisar perguntar; se demorar, segue sem elas
  const mem = await Promise.race([memoria({ operation: "list" }).catch(() => null), espera(2500)]);
  const listaMem = (mem && (mem.memories || mem.memorias || mem.items || mem.rows)) || [];
  const memorias = Array.isArray(listaMem) ? listaMem.filter((x) => x && x.memoryKey !== "apresentacao do felyx").map((x) => "- " + x.memoryKey + ": " + x.memoryValue).join("\n") : "";
  ws = new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token=" + encodeURIComponent(tk.token));
  ws.onopen = () => ws.send(JSON.stringify({ setup: {
    model: "models/" + MODEL,
    generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: VOICE } } } },
    systemInstruction: { parts: [{ text: SYSTEM + nomes + "\n\nMemórias gravadas:\n" + (memorias || "nenhuma") }] },
    tools: TOOLS,
    inputAudioTranscription: {}, outputAudioTranscription: {},
  } }));
  ws.onmessage = async (e) => {
    const msg = JSON.parse(typeof e.data === "string" ? e.data : await e.data.text());
    if (msg.setupComplete) {
      await iris;
      ws.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: "Mensagem automática do sistema: a sessão acabou de abrir. Diga apenas, com calma e simpatia: \"" + cumprimento() + "\" e nada mais. Não chame nenhuma função." }] }], turnComplete: true } }));
      setState("Pode falar");
      $("encerrar").hidden = false;
      ultimoUso = Date.now();
      ocioso = setInterval(() => { if (Date.now() - ultimoUso > OCIOSO_MIN * 60000) stop("Encerrado depois de " + OCIOSO_MIN + " min sem conversa."); }, 5000);
      micNode.port.onmessage = (ev) => {
        if (ws?.readyState !== 1) return;
        const b64 = btoa(String.fromCharCode(...new Uint8Array(ev.data)));
        ws.send(JSON.stringify({ realtimeInput: { audio: { data: b64, mimeType: "audio/pcm;rate=16000" } } }));
      };
    }
    if (msg.toolCall) {
      const functionResponses = await Promise.all(msg.toolCall.functionCalls.map(executar));
      ws?.send(JSON.stringify({ toolResponse: { functionResponses } }));
    }
    const sc = msg.serverContent;
    if (!sc) return;
    if (sc.interrupted) { digitando = false; interromper(); setState("Pode falar"); }
    if (sc.inputTranscription?.text) escutando();
    for (const p of sc.modelTurn?.parts || []) if (p.inlineData) { setState(""); falar(p.inlineData.data); }
    if (sc.turnComplete) { fimDaFala(); setState("Pode falar"); }
  };
  ws.onclose = (e) => { if (ws) stop(e.code === 1000 ? "" : "A conexão caiu. Toque para chamar de novo."); };
}

function stop(motivo) {
  clearInterval(ocioso);
  digitando = false; segurando = false; segurados = [];
  const w = ws; ws = null;
  try { w?.close(1000); } catch (e) {}
  micStream?.getTracks().forEach((t) => t.stop());
  try { audioCtx?.close(); } catch (e) {}
  audioCtx = null; micStream = null; micNode = null;
  fecharAvatar();
  falaAberta = false; ouvindo = false; avatarFalando = false;
  $("encerrar").hidden = true; $("comecar").hidden = false;
  setState(motivo || "");
}

$("comecar").addEventListener("click", () => { felyxIris.preparar(); start().catch((err) => { stop(err.message); if (!SESSAO) mostrarLogin(err.message); }); });
$("encerrar").addEventListener("click", () => stop("Até logo."));
addEventListener("pagehide", () => { if (avatar) fecharAvatar(); });
</script>
